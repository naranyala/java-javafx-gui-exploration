plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'dev.exploration'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

javafx {
    version = '21.0.13'
    modules = ['javafx.controls', 'javafx.fxml']
}

application {
    mainClass = 'dev.exploration.starter.Launcher'
}
